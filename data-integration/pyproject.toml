[project]
name = "data-integration"
version = "0.1.0"
description = "Tests for integrating non-structured data sources with LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "codecarbon>=3.0.4",
    "ipykernel>=6.30.1",
    "langchain>=0.3.27",
    "matplotlib>=3.10.6",
    "numpy>=1.26.4",
    "ollama>=0.3.3",
    "pandas>=2.3.2",
    "pypdf>=4.3.1",
    "r2r[core]>=3.6.6",
    "tqdm>=4.67.1",
]

[dependency-groups]
carbonboard = [
    "dash>=3.2.0",
    "dash-bootstrap-components>=2.0.4",
    "fire>=0.7.1",
]
