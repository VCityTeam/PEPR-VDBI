[project]
name = "data-integration"
version = "0.1.0"
description = "Tests for integrating non-structured data sources with LLMs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "codecarbon>=3.0.4",
    "ipykernel>=6.30.1",
    "langchain>=0.3.27",
    "litellm>=1.81.1",
    "matplotlib>=3.10.6",
    "numpy>=1.26.4",
    "ollama>=0.3.3",
    "pandas>=2.3.2",
    "pypdf>=4.3.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
carbonboard = ["dash>=3.2.0", "dash-bootstrap-components>=2.0.4", "fire>=0.7.1"]
langchain = [
    "langchain-community>=0.3",
    "langchain-ollama>=0.3",
    "langchain-postgres>=0.0.12",
    "pymupdf4llm>=0.0.17",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]
